name: Voice Parser Guard

on:
  push:
    branches: [main]
    paths:
      - 'js/voice-parser.js'
      - 'scripts/voice-autofix.mjs'
      - 'tests/**'
      - '.github/workflows/voice-parser-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Voice Parser Regression
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Check parser syntax
        run: node --check js/voice-parser.js

      - name: Check Gemini Auto-Fix syntax
        run: node --check scripts/voice-autofix.mjs

      - name: Run voice parser regression
        run: |
          node tests/voice-parser.test.cjs
          node tests/voice-autofix.integration.cjs
