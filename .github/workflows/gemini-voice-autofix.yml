name: Gemini Voice Parser Auto-Fix
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  propose-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: mahjong-voice-autofix
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Baseline parser regression
        run: node tests/voice-parser.test.cjs
      - name: Request Gemini parser-only patch
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: node scripts/voice-autofix.mjs
      - name: Validate parser and regression
        run: |
          node --check js/voice-parser.js
          node tests/voice-parser.test.cjs
          git diff --check
          test -z "$(git diff --name-only -- . ':!js/voice-parser.js')"
      - name: Create auto-fix pull request
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.VOICE_AUTOFIX_GH_TOKEN }}
          add-paths: js/voice-parser.js
          branch: bot/gemini-voice-parser-autofix
          delete-branch: true
          title: 'fix(voice): Gemini verified parser improvement'
          body: 'Automated parser-only proposal. Baseline tests passed. Review workflow logs for confirmed training cases.'
      - name: Enable auto-merge (only after branch protection checks)
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.VOICE_AUTOFIX_GH_TOKEN }}
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
        run: gh pr merge "$PR_URL" --auto --squash
