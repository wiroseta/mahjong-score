name: Gemini Voice Parser Auto-Fix

on:
  workflow_dispatch:
#  schedule:
#    - cron: '0 23 * * *'

permissions:
  contents: write

concurrency:
  group: mahjong-voice-autofix-main
  cancel-in-progress: false

jobs:
  update-parser:
    name: Gemini Voice Parser Auto-Update
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify baseline
        run: |
          node --check js/voice-parser.js
          node tests/voice-parser.test.cjs

      - name: Request Gemini parser improvement
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: node scripts/voice-autofix.mjs

      - name: Validate parser and regression
        run: |
          node --check js/voice-parser.js
          node tests/voice-parser.test.cjs
          git diff --check
          test -z "$(git status --porcelain --untracked-files=all -- . ':!js/voice-parser.js')"
      - name: Commit verified parser directly to main
        run: |
          if git diff --quiet -- js/voice-parser.js; then
            echo "No parser changes. Nothing to commit."
            exit 0
          fi

          git config user.name "Mahjong Voice Auto-Fix"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add js/voice-parser.js
          git commit -m "fix(voice): Gemini verified parser improvement"
          git push origin HEAD:main

      - name: Summary
        if: always()
        run: |
          echo "## Mahjong Voice Parser Auto-Update" >> "$GITHUB_STEP_SUMMARY"
          echo "Branch: main" >> "$GITHUB_STEP_SUMMARY"
          echo "Target: js/voice-parser.js" >> "$GITHUB_STEP_SUMMARY"
          echo "Application version: unchanged" >> "$GITHUB_STEP_SUMMARY"
