name: Voice Parser Guard

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'cloud-trial/**'
      - 'js/**'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'scripts/voice-autofix.mjs'
      - 'tests/**'
      - '.github/workflows/voice-parser-guard.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Mahjong Full Regression
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Check parser syntax
        run: node --check js/voice-parser.js

      - name: Check Gemini Auto-Fix syntax
        run: node --check scripts/voice-autofix.mjs

      - name: Run full regression and voice integration
        run: |
          node --test tests/*.test.cjs
          node tests/voice-autofix.integration.cjs
