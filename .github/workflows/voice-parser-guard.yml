name: Voice Parser Guard
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'bot/gemini-voice-parser-autofix')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reject changes outside parser
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          test "$files" = "js/voice-parser.js"
      - run: node --check js/voice-parser.js
      - run: node tests/voice-parser.test.cjs
