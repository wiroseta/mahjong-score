name: Voice Parser Guard

on:
  push:
    branches: [main]
    paths:
      - 'js/voice-parser.js'
      - 'scripts/voice-autofix.mjs'
      - '.github/workflows/voice-parser-guard.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Voice Parser Regression
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Restrict Gemini bot PR to parser only
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'bot/gemini-voice-parser-autofix') }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          test "$files" = 'js/voice-parser.js'

      - name: Check parser syntax
        run: node --check js/voice-parser.js

      - name: Check Gemini Auto-Fix syntax
        run: node --check scripts/voice-autofix.mjs

      - name: Run voice parser regression
        run: node tests/voice-parser.test.cjs
