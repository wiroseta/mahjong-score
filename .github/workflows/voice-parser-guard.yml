name: Voice Parser Guard

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Voice Parser Regression
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check parser syntax
        run: node --check js/voice-parser.js

      - name: Run parser regression tests
        run: node tests/voice-parser.test.cjs

      - name: Verify parser file exists
        run: test -f js/voice-parser.js

      - name: Verify regression tests exist
        run: test -f tests/voice-parser.test.cjs
